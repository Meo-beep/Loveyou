<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thiệp Hoàng Hôn Hoa Anh Đào — Lời Chúc Tình Yêu</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 30%, #ffb199 70%, #ff4b68 100%);
            color: #4a2e35;
        }

        /* Canvas pháo hoa, cánh hoa anh đào & lấp lánh */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Mây trôi & Mặt trời Parallax */
        .clouds-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
            transition: transform 0.1s ease-out;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 100px;
            filter: blur(5px);
            animation: floatCloud linear infinite;
        }

            .cloud::before, .cloud::after {
                content: '';
                position: absolute;
                background: rgba(255, 255, 255, 0.55);
                border-radius: 50%;
            }

        .cloud1 {
            width: 240px;
            height: 75px;
            top: 10%;
            animation-duration: 38s;
        }

            .cloud1::before {
                width: 95px;
                height: 95px;
                top: -40px;
                left: 40px;
            }

            .cloud1::after {
                width: 115px;
                height: 115px;
                top: -50px;
                right: 40px;
            }

        .cloud2 {
            width: 340px;
            height: 110px;
            top: 48%;
            animation-duration: 52s;
            animation-delay: -18s;
        }

            .cloud2::before {
                width: 130px;
                height: 130px;
                top: -60px;
                left: 50px;
            }

            .cloud2::after {
                width: 150px;
                height: 150px;
                top: -70px;
                right: 50px;
            }

        @keyframes floatCloud {
            0% {
                transform: translateX(-400px);
            }

            100% {
                transform: translateX(110vw);
            }
        }

        .sun-wrapper {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            pointer-events: none;
            transition: transform 0.2s ease-out;
        }

        .sun {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #ffffff 20%, #ffdfa9 50%, rgba(255, 154, 162, 0.7) 80%, rgba(255,255,255,0) 100%);
            border-radius: 50%;
            box-shadow: 0 0 90px #ffb382, 0 0 160px #ff758c;
            animation: pulseSun 4s ease-in-out infinite alternate;
        }

        @keyframes pulseSun {
            0% {
                transform: scale(0.95);
                opacity: 0.85;
            }

            100% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        /* Container chính */
        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Phong Bì Mở Đầu VIP */
        .envelope-wrapper {
            position: relative;
            width: 320px;
            height: 220px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(220, 60, 100, 0.35), 0 0 25px rgba(255,255,255,0.9);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
            z-index: 20;
            border: 3px solid #ffffff;
        }

            .envelope-wrapper:hover {
                transform: scale(1.06) rotate(-1deg);
                box-shadow: 0 25px 50px rgba(220, 60, 100, 0.45);
            }

        .envelope-heart {
            font-size: 3.8rem;
            animation: heartBeat 1.2s infinite alternate;
            filter: drop-shadow(0 4px 10px rgba(255, 77, 109, 0.4));
        }

        @keyframes heartBeat {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.18);
            }
        }

        .envelope-title {
            font-family: 'Caveat', cursive;
            font-size: 2.2rem;
            color: #d84374;
            font-weight: 700;
            margin-top: 8px;
        }

        .envelope-sub {
            font-size: 0.85rem;
            color: #7a3b4f;
            background: rgba(255,255,255,0.8);
            padding: 5px 16px;
            border-radius: 20px;
            margin-top: 6px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .envelope-wrapper.opened {
            transform: scale(1.3) translateY(-120px);
            opacity: 0;
            pointer-events: none;
        }

        /* Card Thiệp Nội Dung Chính */
        .card-container {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 35px 30px;
            max-width: 460px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(230, 70, 100, 0.3), 0 0 25px rgba(255,255,255,0.7) inset;
            opacity: 0;
            transform: scale(0.7) translateY(50px);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

            .card-container.active {
                opacity: 1;
                transform: scale(1) translateY(0);
                pointer-events: auto;
            }

            .card-container.fade-out {
                transform: scale(0.92);
                opacity: 0;
            }

        .card-title {
            font-family: 'Caveat', cursive;
            font-size: 2.7rem;
            color: #d84374;
            margin-bottom: 12px;
            text-shadow: 0 2px 5px rgba(216, 67, 116, 0.15);
        }

        .card-text {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #4a2e35;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        /* Nút bấm mềm mại VIP */
        .btn-group {
            margin-top: 22px;
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.45);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
        }

            .btn:hover {
                transform: translateY(-3px) scale(1.05);
                box-shadow: 0 10px 25px rgba(255, 117, 140, 0.65);
            }

            .btn:active {
                transform: translateY(1px);
            }

        .btn-secondary {
            background: linear-gradient(135deg, #ffb382 0%, #f0736a 100%);
            box-shadow: 0 6px 20px rgba(240, 115, 106, 0.45);
        }

        /* Modal Bốc Thẻ Bài Tình Yêu (Hiệu ứng lật 3D) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

            .modal.active {
                opacity: 1;
                pointer-events: auto;
            }

        .modal-content {
            background: rgba(255, 240, 245, 0.96);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 35px 25px;
            width: 88%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            transform: scale(0.7) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .card-drawn {
            background: linear-gradient(135deg, #ffffff 0%, #ffe4e1 100%);
            border: 2px dashed #ff758c;
            border-radius: 20px;
            padding: 25px 20px;
            margin: 20px 0;
            box-shadow: 0 8px 20px rgba(255, 117, 140, 0.18);
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
        }

            .card-drawn.flip {
                transform: rotateY(360deg);
            }

        .card-drawn-title {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ff4d6d;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .card-drawn-text {
            font-size: 1.15rem;
            font-weight: 600;
            color: #592e3a;
            line-height: 1.6;
        }

        /* Nút Âm Nhạc Cố Định VIP */
        .music-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 50;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.4rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: transform 0.2s, background 0.2s;
        }

            .music-btn:hover {
                transform: scale(1.12);
                background: #ffffff;
            }

            .music-btn.playing {
                animation: spinMusic 3s linear infinite;
            }

        @keyframes spinMusic {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 117, 140, 0.4);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(255, 117, 140, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 117, 140, 0);
            }
        }
    </style>
</head>
<body>

    <!-- Canvas Pháo Hoa, Cánh Hoa Anh Đào & Sao Băng -->
    <canvas id="canvas-bg"></canvas>

    <!-- Mây Trôi Parallax -->
    <div class="clouds-container" id="cloudsLayer">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
    </div>

    <!-- Mặt Trời Hoàng Hôn Parallax -->
    <div class="sun-wrapper" id="sunLayer">
        <div class="sun"></div>
    </div>

    <!-- Container Chính -->
    <div class="main-wrapper">
        <!-- Màn Hình Phong Bì Mở Đầu -->
        <div class="envelope-wrapper" id="envelopeBox" onclick="openEnvelope()">
            <div class="envelope-heart">💌</div>
            <div class="envelope-title">Gửi Nhỏ Tí Nị ✨</div>
            <div class="envelope-sub">Chạm nhẹ để mở thiệp hoàng hôn 🌸</div>
        </div>

        <!-- Nội Dung Thiệp Chính -->
        <div class="card-container" id="cardBox">
            <div class="card-title" id="slide-title">Hoàng Hôn Ngọt Ngào 🌅</div>
            <div class="card-text" id="slide-text"></div>
            <div class="btn-group">
                <button class="btn" onclick="nextSlide()">Tiếp tục ✨</button>
                <button class="btn btn-secondary" onclick="openFortuneModal()">🔮 Bốc Thẻ Tình Yêu</button>
            </div>
        </div>
    </div>

    <!-- Modal Thẻ Bài Tình Yêu -->
    <div class="modal" id="fortuneModal">
        <div class="modal-content">
            <h3 style="color: #d84374; font-family: 'Caveat', cursive; font-size: 2.4rem;">Thẻ Bài Tình Yêu 💌</h3>
            <div class="card-drawn" id="drawnCardBox">
                <div class="card-drawn-title" id="fortuneCategory">Lời Chúc Hôm Nay</div>
                <div class="card-drawn-text" id="fortuneText">Bấm nút bên dưới để rút một quẻ tình yêu ngẫu nhiên nha!</div>
            </div>
            <div style="display: flex; gap: 12px; justify-content: center;">
                <button class="btn" onclick="drawFortune()">Bốc Thẻ Mới 🎴</button>
                <button class="btn btn-secondary" onclick="closeFortuneModal()">Đóng 💖</button>
            </div>
        </div>
    </div>

    <!-- Nhạc Nền -->
    <audio id="bgMusic" loop src="leduong.mp3"></audio>
    <div class="music-btn" onclick="toggleMusic()" id="musicIcon" title="Bật/Tắt nhạc">🎵</div>

    <script>
        /* 1. HIỆU ỨNG MỞ PHONG BÌ */
        function openEnvelope() {
            const envelope = document.getElementById('envelopeBox');
            const cardBox = document.getElementById('cardBox');

            envelope.classList.add('opened');

            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    createHeartExplosion(window.innerWidth / 2, window.innerHeight / 2);
                }, i * 150);
            }

            setTimeout(() => {
                cardBox.classList.add('active');
                typeWriterEffect(slides[0].text);
            }, 350);

            if (!isPlaying) {
                toggleMusic();
            }
        }

        /* 2. HIỆU ỨNG GÕ CHỮ (TYPEWRITER) */
        let typingTimeout;
        function typeWriterEffect(text) {
            const textElement = document.getElementById('slide-text');
            textElement.innerHTML = "";
            let i = 0;

            function type() {
                if (i < text.length) {
                    textElement.innerHTML += text.charAt(i);
                    i++;
                    typingTimeout = setTimeout(type, 25);
                }
            }
            type();
        }

        /* 3. SLIDER NỘI DUNG LỜI CHÚC */
        const slides = [
            {
                title: "Hoàng Hôn Ngọt Ngào 🌅",
                text: "Mỗi hoàng hôn buông xuống đều nhắc anh nhớ rằng: Cảm ơn vì đã xuất hiện và làm cho thế giới của anh trở nên thật dịu dàng."
            },
            {
                title: "Gửi Em - Nhỏ Tí Nị 💕",
                text: "Trời hoàng hôn có đẹp đến mấy cũng không bằng nụ cười của em. Mong rằng mỗi ngày trôi qua em đều tràn ngập niềm vui và sự ấm áp!"
            },
            {
                title: "Điều Nhỏ Bé Ngọt Ngào 🌸",
                text: "Cảm ơn em vì đã luôn kiên nhẫn, yêu thương và đồng hành. Chúc cho tụi mình sẽ luôn giữ trọn sự ngọt ngào này nhé!"
            },
            {
                title: "Hoàng Hôn & Em ✨",
                text: "Nhấp vào nút 'Bốc Thẻ Tình Yêu' phía dưới để xem hôm nay 'vũ trụ' gửi lời chúc siêu dính nào dành riêng cho em nha!"
            }
        ];

        let currentSlide = 0;
        const cardBox = document.getElementById('cardBox');

        function nextSlide() {
            clearTimeout(typingTimeout);
            cardBox.classList.add('fade-out');
            setTimeout(() => {
                currentSlide = (currentSlide + 1) % slides.length;
                document.getElementById('slide-title').innerText = slides[currentSlide].title;
                typeWriterEffect(slides[currentSlide].text);
                cardBox.classList.remove('fade-out');
            }, 250);

            createHeartExplosion(window.innerWidth / 2, window.innerHeight / 2);
        }

        /* 4. BẢNG BỐC THẺ BÀI TÌNH YÊU (CÓ HIỆU ỨNG LẬT 3D) */
        const fortunes = [
            { cat: "Quẻ Thượng Thượng 💖", text: "Hôm nay em sẽ nhận được gấp đôi sự yêu thương và chiều chuộng!" },
            { cat: "Quẻ Siêu Dính 🍬", text: "Tỷ lệ 'thèm ôm' hôm nay lên tới 99.9%. Yêu cầu chuẩn bị tinh thần!" },
            { cat: "Quẻ Bình An 🌸", text: "Mọi mệt mỏi sẽ tan biến khi hoàng hôn buông xuống, thay vào đó là sự êm đềm." },
            { cat: "Quẻ May Mắn 🌟", text: "Hôm nay làm gì cũng mượt mà, ăn gì cũng thấy ngon và luôn có người nghĩ về em." },
            { cat: "Quẻ Chiều Chuộng 👑", text: "Thẻ đặc quyền: Có thể yêu cầu 1 điều ước và người ấy phải thực hiện ngay!" },
            { cat: "Quẻ Vô Giá ✨", text: "Nụ cười của em hôm nay chính là điều tuyệt vời nhất vũ trụ này." }
        ];

        function openFortuneModal() {
            document.getElementById('fortuneModal').classList.add('active');
        }

        function closeFortuneModal() {
            document.getElementById('fortuneModal').classList.remove('active');
        }

        function drawFortune() {
            const cardDrawn = document.getElementById('drawnCardBox');
            cardDrawn.classList.add('flip');

            setTimeout(() => {
                const rand = fortunes[Math.floor(Math.random() * fortunes.length)];
                document.getElementById('fortuneCategory').innerText = rand.cat;
                document.getElementById('fortuneText').innerText = rand.text;
                createHeartExplosion(window.innerWidth / 2, window.innerHeight / 2);
            }, 300);

            setTimeout(() => {
                cardDrawn.classList.remove('flip');
            }, 600);
        }

        /* 5. PARALLAX THEO CHUYỂN ĐỘNG CHUỘT */
        const cloudsLayer = document.getElementById('cloudsLayer');
        const sunLayer = document.getElementById('sunLayer');

        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 30;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            cloudsLayer.style.transform = `translate(${-x}px, ${-y}px)`;
            sunLayer.style.transform = `translateX(-50%) translate(${x * 0.5}px, ${y * 0.5}px)`;
        });

        /* 6. CANVAS: SAO BĂNG, HẠT LẤP LÁNH, CÁNH HOA & PHÁO HOA */
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let petals = [];
        let sparkles = [];
        let shootingStars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 40; i++) {
            sparkles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2.5 + 1,
                speedY: Math.random() * -0.4 - 0.2,
                opacity: Math.random(),
                fade: Math.random() * 0.02 + 0.005
            });
        }

        for (let i = 0; i < 28; i++) {
            petals.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 8 + 6,
                speedY: Math.random() * 1.2 + 0.6,
                speedX: Math.random() * 0.8 - 0.4,
                angle: Math.random() * 360,
                spin: Math.random() * 2 - 1
            });
        }

        // Thêm sao băng lãng mạn
        setInterval(() => {
            if (Math.random() > 0.4) {
                shootingStars.push({
                    x: Math.random() * canvas.width,
                    y: 0,
                    length: Math.random() * 80 + 40,
                    speed: Math.random() * 8 + 6,
                    opacity: 1
                });
            }
        }, 3500);

        class Particle {
            constructor(x, y, isHeart = false) {
                this.x = x;
                this.y = y;
                this.isHeart = isHeart;
                this.size = isHeart ? Math.random() * 14 + 10 : Math.random() * 4 + 2;
                this.speedX = (Math.random() - 0.5) * (isHeart ? 7 : 5);
                this.speedY = (Math.random() - 0.5) * (isHeart ? 7 : 5) - (isHeart ? 2 : 0);
                this.color = `hsl(${Math.random() * 50 + 325}, 100%, 75%)`;
                this.opacity = 1;
                this.gravity = 0.06;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += this.gravity;
                this.opacity -= 0.012;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.opacity, 0);
                ctx.fillStyle = this.color;

                if (this.isHeart) {
                    ctx.beginPath();
                    const th = this.size * 0.3;
                    ctx.moveTo(this.x, this.y + th);
                    ctx.bezierCurveTo(this.x, this.y, this.x - this.size / 2, this.y, this.x - this.size / 2, this.y + th);
                    ctx.bezierCurveTo(this.x - this.size / 2, this.y + (this.size + th) / 2, this.x, this.y + this.size, this.x, this.y + this.size);
                    ctx.bezierCurveTo(this.x, this.y + this.size, this.x + this.size / 2, this.y + (this.size + th) / 2, this.x + this.size / 2, this.y + th);
                    ctx.bezierCurveTo(this.x + this.size / 2, this.y, this.x, this.y, this.x, this.y + th);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function createHeartExplosion(x, y) {
            for (let i = 0; i < 25; i++) {
                particles.push(new Particle(x, y, true));
                particles.push(new Particle(x, y, false));
            }
        }

        window.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON' && !e.target.classList.contains('envelope-wrapper')) {
                createHeartExplosion(e.clientX, e.clientY);
            }
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ sao băng
            ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
            ctx.lineWidth = 2;
            shootingStars.forEach((star, index) => {
                star.x += star.speed;
                star.y += star.speed;
                star.opacity -= 0.015;

                ctx.save();
                ctx.globalAlpha = Math.max(star.opacity, 0);
                ctx.beginPath();
                ctx.moveTo(star.x, star.y);
                ctx.lineTo(star.x - star.length, star.y - star.length);
                ctx.stroke();
                ctx.restore();

                if (star.opacity <= 0) {
                    shootingStars.splice(index, 1);
                }
            });

            // Hạt lấp lánh
            ctx.fillStyle = "#ffffff";
            sparkles.forEach(s => {
                s.y += s.speedY;
                s.opacity += s.fade;
                if (s.opacity > 1 || s.opacity < 0) s.fade = -s.fade;
                if (s.y < 0) { s.y = canvas.height; s.x = Math.random() * canvas.width; }

                ctx.save();
                ctx.globalAlpha = Math.abs(s.opacity);
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Cánh hoa anh đào rơi
            petals.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;
                p.angle += p.spin;

                if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.angle * Math.PI) / 180);
                ctx.fillStyle = "rgba(255, 183, 197, 0.75)";
                ctx.beginPath();
                ctx.ellipse(0, 0, p.size, p.size / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Pháo hoa trái tim
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].opacity <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }

            requestAnimationFrame(animate);
        }
        animate();

        /* 7. BẬT / TẮT NHẠC VIP */
        const audio = document.getElementById('bgMusic');
        let isPlaying = false;

        function toggleMusic() {
            const iconBtn = document.getElementById('musicIcon');
            if (isPlaying) {
                audio.pause();
                iconBtn.innerText = '🔇';
                iconBtn.classList.remove('playing');
            } else {
                audio.play().catch(() => { });
                iconBtn.innerText = '🎵';
                iconBtn.classList.add('playing');
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
